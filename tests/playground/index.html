<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woxi Playground</title>
  <meta name="description"
        content="Full-screen playground for Woxi, a Wolfram Language
          interpreter implemented in Rust.
          Everything runs locally in your browser.">

  <!-- Social media preview (Open Graph + Twitter Card) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://woxi.ad-si.com/playground/">
  <meta property="og:site_name" content="Woxi">
  <meta property="og:title" content="Woxi Playground">
  <meta property="og:description"
        content="Run Wolfram Language code directly in your browser
          with Woxi, a Wolfram Language interpreter implemented in Rust.">
  <meta property="og:image" content="https://woxi.ad-si.com/images/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt"
        content="Woxi logo with the tagline
          'Wolfram Language interpreter implemented in Rust'
          above a row of example plots">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="status" id="status"></div>

  <header>
    <h1>Woxi Playground</h1>
    <nav>
      <a href="/docs/">Documentation</a>
      <div class="nav-right">
        <a id="githubLink" href="https://github.com/ad-si/Woxi"
           aria-label="Woxi on GitHub" title="Woxi on GitHub">
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button id="themeBtn" aria-label="Toggle theme"></button>
      </div>
    </nav>
  </header>

  <main>
    <section class="editor-pane">
      <div class="editor-container" id="editor"></div>
      <div class="controls">
        <button id="clearBtn">Clear</button>
        <div class="controls-right">
          <button id="shareBtn">Share</button>
          <button id="runBtn" disabled data-tooltip="Run code (&#8679; + Enter)">
            Run
            <div class="spinner" id="runSpinner"></div>
          </button>
        </div>
      </div>
    </section>
    <section class="output-pane">
      <div id="outputs"></div>
    </section>
  </main>

  <!-- Load the app script with a cache-busting query so a browser never
       runs a stale script.js against a freshly built wasm module. -->
  <script>
    (function () {
      const s = document.createElement("script")
      s.type = "module"
      s.src = "script.js?v=" + Date.now()
      document.head.appendChild(s)
    })()
  </script>
</body>

</html>
