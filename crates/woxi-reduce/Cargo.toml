[package]
name = "woxi-reduce"
description = "Self-contained exact linear arithmetic and Presburger quantifier elimination"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/ad-si/Woxi"

[dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"

[[bench]]
name = "reduce"
harness = false
