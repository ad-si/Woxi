[package]
name = "woxi-parser"
description = "Pest grammar and generated parser for the Wolfram Language, used by Woxi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ad-si/Woxi"

[dependencies]
# Held on 2.8: pest 2.9 probes the remaining native stack (pest_stack_guard)
# on every rule call, which made parse-heavy evaluation ~30% slower
# (plot3d_of_one_element_list_result: 9 s -> 12 s, timing out in CI).
pest = "~2.8.8"
pest_derive = "~2.8.8"
